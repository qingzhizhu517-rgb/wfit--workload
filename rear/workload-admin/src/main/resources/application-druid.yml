# 数据源配置
#
# 凭据一律从环境变量注入，不再硬编码入库（见仓库根 .env.example）：
#   WFIT_DB_HOST / WFIT_DB_PORT / WFIT_DB_NAME / WFIT_DB_USER / WFIT_DB_PASSWORD
#   WFIT_DRUID_USER / WFIT_DRUID_PASSWORD
# 其中 *_PASSWORD 故意不设默认值：未注入则启动即失败，避免沿用弱口令而不自知。
# IDEA: Run/Debug Configurations -> Environment variables
# PowerShell: $env:WFIT_DB_PASSWORD='xxx' 后再启动
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://${WFIT_DB_HOST:127.0.0.1}:${WFIT_DB_PORT:3306}/${WFIT_DB_NAME:wflg_workload}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: ${WFIT_DB_USER:wfit}
                password: ${WFIT_DB_PASSWORD}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # 生产环境建议置 false 直接关闭监控页（或配 allow 白名单限内网）
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码（原 ruoyi/123456 为框架默认值，全网皆知，已改为环境变量注入）
                login-username: ${WFIT_DRUID_USER:admin}
                login-password: ${WFIT_DRUID_PASSWORD}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true